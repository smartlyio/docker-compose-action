name: Build

on: workflow_call

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - name: 'Install'
        run: |
          npm install
      - name: 'Prettier'
        run: |
          npm run format-check
      - name: 'Lint'
        run: |
          npm run lint
      - name: 'Test'
        run: |
          npm run test
      - name: 'build'
        run: |
          npm run build
          npm run package

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
      - name: 'Build action for test'
        run: |
          npm install
          npm run all
          git clean -fXd
      - name: Test executing the action
        uses: ./
        with:
          composeFile: docker-compose.ci.yml
          serviceName: test
          composeCommand: run
          composeArguments: ''
          runCommand: ls
          build: 'true'
          push: 'false'
          build-args: |
            MY_TEST_ARG=some-value
            OTHER_ARG=2

  release:
    runs-on: ubuntu-22.04
    name: 'Build and release action'
    needs: [build, test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Configure git
        uses: smartlyio/github-actions@4ef49912877febb62867891d42a1205190fb2ab0 # git-init-userinfo-v1
      - name: Release flow
        uses: smartlyio/github-actions@ac9cc7e148b55d6c88641ea387ab6d2860ba5c3e # release-action-node-v1
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          dry_run: ${{ github.event_name == 'pull_request' }}
          use_yarn: true
